# 数据库连接配置
#
# 账号 / 口令等敏感信息不再硬编码在版本库中，改为从外部注入，优先级：
#   1. JVM 系统属性：-Djdbc.url=... -Djdbc.username=... -Djdbc.password=...
#   2. 环境变量：  JDBC_URL / JDBC_USERNAME / JDBC_PASSWORD
#   3. 本文件中的默认值（仅用于本地开发，生产环境必须通过 1 或 2 覆盖）
#
# 生产环境请为应用单独创建库账号，只授予业务库所需的最小权限，禁止使用 root。
jdbc.driverClassName=com.mysql.jdbc.Driver
jdbc.url=${JDBC_URL:jdbc:mysql://127.0.0.1:3306/qywx?useUnicode=true&characterEncoding=UTF-8&useSSL=true}
jdbc.username=${JDBC_USERNAME:qywx}
jdbc.password=${JDBC_PASSWORD:}
druid.pool.size.init = 10
druid.pool.size.min   = 10
druid.pool.size.max  = 50
druid.pool.timeBetweenEvictionRunsMillis=60000
druid.pool.minEvictableIdleTimeMillis=300000
druid.pool.maxOpenPreparedStatements=20
druid.pool.removeAbandoned=true
druid.pool.removeAbandonedTimeout=1800
druid.pool.logAbandoned=true